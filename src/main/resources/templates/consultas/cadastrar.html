<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${consulta.id} ? 'Editar Consulta' : 'Cadastrar Consulta'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4 text-primary" th:text="${consulta.id} ? 'Editar Consulta' : 'Cadastrar Consulta'"></h1>
    <a th:href="@{/consultas}" class="btn btn-outline-secondary mb-4">Voltar para a lista</a>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/consultas/salvar}" th:object="${consulta}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="dataConsulta" class="form-label">Data e Hora:</label>
                    <input type="datetime-local" id="dataConsulta"
                           th:field="*{dataConsulta}"
                           class="form-control"
                           required />
                </div>

                <div class="mb-3">
                    <label for="paciente" class="form-label">Paciente:</label>
                    <div class="mb-3">
                        <label for="paciente" class="form-label">Paciente:</label>
                        <select id="paciente" th:field="*{paciente}" class="form-select" required>
                            <option value="">Selecione um Paciente</option>
                            <option th:each="paciente : ${pacientes}"
                                    th:value="${paciente.id}"
                                    th:text="${paciente.nome}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="medico" class="form-label">Médico:</label>
                    <select id="medico" th:field="*{medico}" class="form-select" required>
                        <option value="">Selecione um Médico</option>
                        <option th:each="medico : ${medicos}"
                                th:value="${medico.id}"
                                th:text="${medico.nome + ' (' + medico.especialidade + ')'}"></option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="observacoes" class="form-label">Observações (Opcional):</label>
                    <textarea id="observacoes" th:field="*{observacoes}" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span th:text="${consulta.id} ? 'Atualizar Consulta' : 'Agendar Consulta'"></span>
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
