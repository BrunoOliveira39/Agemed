<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Agenda Médica - Consultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary">Agenda de Consultas</h1>
        <div>
            <a th:href="@{/consultas/cadastrar}" class="btn btn-success me-2">
                <i class="fas fa-plus-circle"></i> Nova Consulta
            </a>
            <a th:href="@{/medicos}" class="btn btn-outline-secondary me-2">Médicos</a>
            <a th:href="@{/logout}" class="btn btn-danger">Sair</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Data e Hora</th>
                    <th>Paciente</th>
                    <th>Médico</th>
                    <th>Especialidade</th>
                    <th class="text-center">Detalhes</th>
                    <th class="text-center">Ações</th>
                </tr>
                </thead>
                <tbody>
                <th:block th:each="consulta : ${consultas}">
                    <tr>
                        <td th:text="${consulta.id}">1</td>
                        <td th:text="${#temporals.format(consulta.dataConsulta, 'dd/MM/yyyy HH:mm')}">20/10/2025 10:00</td>
                        <td th:text="${consulta.paciente.nome}">João Silva</td>
                        <td th:text="${consulta.medico.nome}">Dr. Exemplo</td>
                        <td th:text="${consulta.medico.especialidade}">Clínico Geral</td>

                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-info"
                                    type="button"
                                    data-bs-toggle="collapse"
                                    th:attr="data-bs-target='#observacao' + ${consulta.id}"
                                    aria-expanded="false"
                                    th:aria-controls="observacao + ${consulta.id}">
                                Observações
                            </button>
                        </td>

                        <td class="text-center">
                            <a th:href="@{/consultas/editar/{id}(id=${consulta.id})}" class="btn btn-sm btn-info text-white me-2">Editar</a>
                            <a th:href="@{/consultas/excluir/{id}(id=${consulta.id})}"
                               onclick="return confirm('Tem certeza que deseja excluir a consulta?')"
                               class="btn btn-sm btn-danger">Excluir</a>
                        </td>
                    </tr>

                    <tr class="collapse" th:id="'observacao' + ${consulta.id}">
                        <td colspan="7"> <div class="card card-body bg-light mt-1 mb-1">
                            <strong class="text-secondary">Observações:</strong>
                            <p th:if="${consulta.observacoes}" th:text="${consulta.observacoes}"></p>
                            <p th:unless="${consulta.observacoes}" class="fst-italic text-muted">Nenhuma observação registrada.</p>
                        </div>
                        </td>
                    </tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
