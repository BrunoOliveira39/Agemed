<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${paciente.id} ? 'Editar Paciente' : 'Cadastrar Paciente'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <script src="https://unpkg.com/imask"></script>

</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4 text-primary" th:text="${paciente.id} ? 'Editar Paciente' : 'Cadastrar Paciente'"></h1>
    <a th:href="@{/pacientes}" class="btn btn-outline-secondary mb-4">Voltar para a lista</a>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/pacientes/salvar}" th:object="${paciente}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" id="nome" th:field="*{nome}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone:</label>
                    <input type="text" id="telefone" th:field="*{telefone}" class="form-control" required />
                </div>

                <button type="submit" class="btn btn-primary">
                    <span th:text="${paciente.id} ? 'Atualizar' : 'Salvar'"></span>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        // Opções da máscara para telefone (celular e fixo)
        const mascaraTelefone = {
            mask: [
                { mask: '(00) 0000-0000' }, // Telefone fixo
                { mask: '(00) 00000-0000' } // Celular
            ]
        };

        // Seleciona o campo de input pelo ID
        const elementoTelefone = document.getElementById('telefone');

        // Aplica a máscara
        if (elementoTelefone) {
            IMask(elementoTelefone, mascaraTelefone);
        }
    });
</script>

</body>
</html>
