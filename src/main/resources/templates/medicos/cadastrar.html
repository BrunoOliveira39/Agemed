<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${medico.id} ? 'Editar Médico' : 'Cadastrar Médico'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4 text-primary" th:text="${medico.id} ? 'Editar Médico' : 'Cadastrar Médico'"></h1>
    <a th:href="@{/medicos}" class="btn btn-outline-secondary mb-4">Voltar para a lista</a>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/medicos/salvar}" th:object="${medico}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" id="nome" th:field="*{nome}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label for="especialidade" class="form-label">Especialidade:</label>
                    <input type="text" id="especialidade" th:field="*{especialidade}" class="form-control" required />
                </div>

                <button type="submit" class="btn btn-primary">
                    <span th:text="${medico.id} ? 'Atualizar' : 'Salvar'"></span>
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
