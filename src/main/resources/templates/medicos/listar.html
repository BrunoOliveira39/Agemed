<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Agenda Médica - Médicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary">Gestão de Médicos</h1>
        <div>
            <a th:href="@{/medicos/cadastrar}" class="btn btn-success me-2">
                <i class="fas fa-plus-circle"></i> Novo Médico
            </a>
            <a th:href="@{/consultas}" class="btn btn-outline-secondary me-2">Consultas</a>
            <a th:href="@{/logout}" class="btn btn-danger">Sair</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Especialidade</th>
                    <th class="text-center">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="medico : ${medicos}">
                    <td th:text="${medico.id}">1</td>
                    <td th:text="${medico.nome}">Dr. Silva</td>
                    <td th:text="${medico.especialidade}">Cardiologia</td>
                    <td class="text-center">
                        <a th:href="@{/medicos/editar/{id}(id=${medico.id})}" class="btn btn-sm btn-info text-white me-2">Editar</a>
                        <a th:href="@{/medicos/excluir/{id}(id=${medico.id})}"
                           onclick="return confirm('Tem certeza que deseja excluir?')"
                           class="btn btn-sm btn-danger">Excluir</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
