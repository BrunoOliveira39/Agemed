<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Cadastro - Agenda Médica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .register-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .register-card {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="card register-card shadow-lg">
        <div class="card-header bg-success text-white text-center">
            <h4 class="mb-0">Novo Cadastro</h4>
        </div>
        <div class="card-body">
            <h1 class="card-title text-center text-secondary mb-4">Cadastre-se</h1>

            <form th:action="@{/cadastro}" th:object="${usuario}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário:</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" required />
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Senha:</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" required />
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg">Cadastrar</button>
                </div>
            </form>
            <p class="mt-3 text-center">
                Já tem conta? <a th:href="@{/login}">Faça Login</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
