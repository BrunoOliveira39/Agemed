<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login - Agenda Médica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="card login-card shadow-lg">
        <div class="card-header bg-primary text-white text-center">
            <h4 class="mb-0">Acesso ao Sistema Agemed</h4>
        </div>
        <div class="card-body">

            <h1 class="card-title text-center text-secondary mb-4">Login</h1>

            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                Usuário ou senha inválidos.
            </div>
            <div th:if="${param.logout}" class="alert alert-info" role="alert">
                Você foi desconectado com sucesso.
            </div>
            <div th:if="${param.success}" class="alert alert-success" role="alert">
                Cadastro realizado! Por favor, faça login.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário:</label>
                    <input type="text" id="username" name="username" class="form-control" required />
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Senha:</label>
                    <input type="password" id="password" name="password" class="form-control" required />
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                </div>
            </form>
            <p class="mt-3 text-center">
                Não tem conta? <a th:href="@{/cadastro}">Cadastre-se aqui</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
